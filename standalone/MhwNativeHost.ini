[Standalone]
Enabled=1
; F8 first captures the untouched inputs, then requests 10 seconds of jitter.
; This diagnostic does not run DLSS SR or change the internal render scale.
ProjectionPulse=1
; Remain available for another F8 capture. Cancel or Enabled=0 removes hooks.
KeepArmed=1
; A startup failure keeps Enabled unchanged and writes a per-process status file.
; Explicit Cancel or completing a one-shot capture still sets Enabled=0.
